name: Daily 24h LinkedIn external links

on:
  schedule:
    # The daily run is started at 12:00 AM Asia/Karachi (UTC+5, no DST) Mon-Sat by an external
    # timer (cron-job.org -> workflow_dispatch API), because GitHub starts scheduled runs hours late.
    # These schedules are only backups in case the timer fails (19:00 UTC = 12:00 AM PKT);
    # the "gate" job skips them when a run for the same tab already ran or is running.
    - cron: "5 19 * * 0-5"
    - cron: "35 19 * * 0-5"
    - cron: "15 20 * * 0-5"
    - cron: "15 21 * * 0-5"
    - cron: "15 23 * * 0-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Send dry_run=true to the website (no rows written there)"
        type: boolean
        default: false

permissions:
  contents: write   # commit data/last_run.json (keepalive so the schedule is never auto-disabled)
  actions: read     # gate job lists today's earlier runs

concurrency:
  group: daily-scrape
  cancel-in-progress: false

env:
  SHARDS: 4

jobs:
  # Manual / timer (workflow_dispatch) runs always continue. Scheduled backups continue only if no
  # earlier scheduled or dispatched run of this run window is running or succeeded (a failed or
  # cancelled one lets the next backup trigger retry).
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Run window = 6:00 PM PKT the evening before the tab's day until 6:00 PM PKT on it
          # (same rule as tab_name_for in daily_pipeline.py).
          target=$(TZ=Asia/Karachi date -d '+6 hours' +%F)
          since=$(date -u -d "$target 00:00 +0500 - 6 hours" +%Y-%m-%dT%H:%M:%SZ)
          earlier=$(gh run list -R "$GITHUB_REPOSITORY" -w daily-scrape.yml -L 40 \
            --json databaseId,event,createdAt,status,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.createdAt >= \"$since\")
                   | select(.event == \"schedule\" or .event == \"workflow_dispatch\")
                   | select(.conclusion != \"failure\" and .conclusion != \"cancelled\" and .conclusion != \"timed_out\")] | length")
          echo "Run window for tab $target starts $since UTC; earlier runs in it: $earlier"
          if [ "$earlier" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover tests

  # LinkedIn rate-limits (HTTP 429) per IP. Each matrix job runs on its own runner VM with its
  # own public IP, so splitting the keywords over 4 shards cuts the requests per IP by ~4x.
  scrape:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180   # slowest shard took ~70 min under heavy throttling
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape shard ${{ matrix.shard }}
        run: |
          # Stagger shard start times a little so they do not all hit LinkedIn in the same second.
          sleep $(( ${{ matrix.shard }} * 15 ))
          python -u daily_pipeline.py --scrape-only shards --shard ${{ matrix.shard }} --shards $SHARDS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: shards/
          if-no-files-found: warn
          retention-days: 7

  finish:
    needs: scrape
    if: ${{ !cancelled() && needs.scrape.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true

      - name: Merge shards -> filter -> resolve -> POST
        env:
          TRUESOFTS_INGEST_URL: ${{ secrets.TRUESOFTS_INGEST_URL }}
          TRUESOFTS_INGEST_TOKEN: ${{ secrets.TRUESOFTS_INGEST_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -u daily_pipeline.py --merge shards --dry-run
          else
            python -u daily_pipeline.py --merge shards
          fi

      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-jobs-${{ github.run_id }}
          path: |
            *.csv
            shards/*.json
            external_apply_urls.json
            data/last_run.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit keepalive (data/last_run.json)
        if: always()
        run: |
          [ -f data/last_run.json ] || { echo "no last_run.json"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_run.json
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "chore: daily run ${{ github.run_id }} [skip ci]"
            git pull --rebase --autostash
            git push
          fi
